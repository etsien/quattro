[project]
name = "quattro"
version = "0.1.0"
description = "Check that a cert key is not equal to '4'."
requires-python = ">=3.9"
dependencies = ["cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
